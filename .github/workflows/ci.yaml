name: CI

on:
  push:
    # Fires when a tag matching v* is pushed with personal credentials.
    tags: ['v*']
    branches: [main]
    # paths-ignore:
    #   - 'CHANGELOG.md'
    #   - 'package.json'
    #   - 'package-lock.json'
  workflow_dispatch:
    inputs:
      fail-on-no-release:
        description: 'Fail the workflow if no release is published (e.g. if there are no relevant commits).'
        type: boolean
        required: false
        default: true
      publish:
        description: 'Whether to run in publish mode.'
        type: boolean
        required: false
        default: false

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: true

permissions:
  contents: read

# Use PAT instead of GITHUB_TOKEN to cause semantic-release to trigger tag pipeline when tag is created.
# 'Fine-grained token' repo permissions: Contents

jobs:
  # meta:
  #   name: Meta
  #   permissions:
  #     contents: read
  #   uses: stairwaytowonderland/.github/.github/workflows/ci-meta.yaml@v1
  #   with:
  #     publish: ${{ inputs.publish == true }}

  release:
    name: Release
    # needs: [meta]
    # if: needs.meta.outputs.is-release-workflow == 'true'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    uses: ./.github/workflows/release.yaml
    with:
      dispatch-workflow: ''
      fail-on-no-release: ${{ inputs.fail-on-no-release == true }}
    secrets: inherit

  release-outputs:
    name: Release Outputs
    needs: [release]
    runs-on: ubuntu-latest
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - name: Get Release Outputs
        id: release-outputs
        env:
          RELEASE_OUTPUTS: ${{ toJson(needs.release.outputs) }}
        run: |
          echo "Release Outputs: $RELEASE_OUTPUTS"

  publish:
    name: Publish
    needs: [release]
    # if: needs.meta.outputs.is-publish-workflow == 'true'
    if: needs.release.outputs.new-release-published == 'true'
    uses: ./.github/workflows/publish.yaml

    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  normalize-majorver:
    name: Normalize Major Version Tag
    needs: [publish]
    if: (needs.publish.outputs.release-published == 'true' && github.event_name == 'workflow_dispatch') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: stairwaytowonderland/.github/.github/workflows/normalize-majorver.yaml@v1
