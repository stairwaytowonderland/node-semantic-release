name: CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'package*.json'
      - 'action.y*ml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - '**/src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    name: 'GitHub Actions Test: use-project-dependencies'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        use-project-dependencies: [true, false]
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          dry-run: true
          use-project-dependencies: ${{ matrix.use-project-dependencies }}
